name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already carries a full Android SDK, so this discovers
      # it instead of using android-actions/setup-android, whose default
      # package list still asks sdkmanager for the retired "tools" package and
      # aborts the job ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK found (looked at $SDK)"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKM"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKM" >> "$GITHUB_ENV"

      - name: Install SDK packages
        # build-tools 35+ is required: 34.0.0's d8 crashes with an internal
        # NullPointerException on anonymous inner classes, and the script
        # prefers 35.0.0 when it is installed.
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;35.0.0" "platform-tools"
          ls -d "$ANDROID_HOME"/build-tools/* "$ANDROID_HOME"/platforms/*

      - run: npm ci

      - name: Build web bundle
        run: npm run build

      # setup-android exports ANDROID_HOME/ANDROID_SDK_ROOT and setup-java
      # exports JAVA_HOME; the script picks both up.
      - name: Build signed APK
        run: bash tools/build-apk.sh --skip-web

      - name: Record checksum
        run: |
          sha256sum build/yurewatch-*.apk | tee build/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yurewatch-apk
          path: |
            build/yurewatch-*.apk
            build/SHA256SUMS
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/yurewatch-*.apk
            build/SHA256SUMS
          body: |
            YureWatch ${{ github.ref_name }} — Japan earthquake / EEW viewer.

            **This APK is signed with an ephemeral CI key** (generated at build
            time, not stored). It installs and runs, but it cannot be updated
            over an installation signed with a different key, and it is not a
            Play Store artefact.

            Informational viewer only. Not an earthquake prediction or detection
            system, and not a substitute for JMA announcements or local
            authority instructions.

            See the repository README for build instructions, data sources and
            limitations.
          fail_on_unmatched_files: true
