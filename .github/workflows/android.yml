name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already carries a full Android SDK, so this discovers
      # it instead of using android-actions/setup-android, whose default
      # package list still asks sdkmanager for the retired "tools" package and
      # aborts the job ("Failed to find package 'tools'").
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK found (looked at $SDK)"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKM"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKM" >> "$GITHUB_ENV"

      - name: Install SDK packages
        # build-tools 35+ is required: 34.0.0's d8 crashes with an internal
        # NullPointerException on anonymous inner classes, and the script
        # prefers 35.0.0 when it is installed.
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;35.0.0" "platform-tools"
          ls -d "$ANDROID_HOME"/build-tools/* "$ANDROID_HOME"/platforms/*

      - run: npm ci

      - name: Build web bundle
        run: npm run build

      # Signing strategy (docs/RELEASING.md): tagged releases MUST be signed
      # with the project release key so users can install updates over an
      # existing installation. The key lives only in repository secrets and
      # is decoded into the runner's temp directory for this job. A tag build
      # without the secrets fails here, loudly, instead of silently shipping
      # another ephemeral key that would strand existing users.
      - name: Prepare release signing key (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Tagged releases must be signed with the project release key (see docs/RELEASING.md). Refusing to ship an ephemerally-signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASS=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASS=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "release keystore prepared"

      # setup-android exports ANDROID_HOME/ANDROID_SDK_ROOT and setup-java
      # exports JAVA_HOME; the script picks both up. Non-tag CI builds fall
      # back to the script's throwaway key: fine for a smoke-test artefact,
      # never published as a release.
      - name: Build signed APK
        run: bash tools/build-apk.sh --skip-web

      # Bare filename inside SHA256SUMS so a user who downloads the APK and
      # the checksum file into one folder can run `sha256sum -c SHA256SUMS`.
      - name: Record and verify checksum
        run: |
          set -euo pipefail
          cd build
          sha256sum yurewatch-*.apk > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yurewatch-apk
          path: |
            build/yurewatch-*.apk
            build/SHA256SUMS
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/yurewatch-*.apk
            build/SHA256SUMS
          body: |
            YureWatch ${{ github.ref_name }} — Japan earthquake / EEW viewer for Android.

            Bilingual interface: **Japanese (default)** and English, switched from the
            header and remembered across restarts.

            **Signing:** this APK is signed with the project release key, so it
            installs as an update over any earlier release signed with the same
            key. Builds published before the release key was introduced (v0.4.0
            and earlier) used an ephemeral CI key — if you installed one of
            those, uninstall it once before installing this build. This is not
            a Play Store artefact. Verify your download with the attached
            `SHA256SUMS` (`sha256sum -c SHA256SUMS`).

            Informational viewer only. Not an earthquake prediction or detection
            system, and not a substitute for JMA announcements or local
            authority instructions.

            See the repository README for build instructions, data sources and
            limitations.
          fail_on_unmatched_files: true
