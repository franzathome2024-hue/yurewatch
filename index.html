<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#070c12" />
    <meta
      name="description"
      content="日本国内の地震情報・緊急地震速報（EEW）・津波情報を地図上で確認できる情報閲覧アプリ。地震の予測や独自検出は行いません。"
    />
    <meta name="color-scheme" content="dark" />
    <title>YureWatch — 日本 地震・緊急地震速報ビューア</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d141d'/%3E%3Cpath d='M8 34h10l4-12 6 24 6-18 4 6h18' fill='none' stroke='%23ffd23f' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "YureWatch",
        "url": "https://franzathome2024-hue.github.io/yurewatch/viewer/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Android, Web browser",
        "inLanguage": ["ja", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "日本国内の地震情報・緊急地震速報（EEW）・津波情報を地図上で確認できる情報閲覧アプリ。気象庁の発表を表示するもので、地震の予測や独自検出は行いません。Informational viewer for Japan earthquakes, EEW and tsunami forecasts published by JMA. Not a prediction or safety system."
      }
    </script>
    <style>
      /* Paint the shell before the bundle executes: no white flash on launch. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070c12;
        color: #e9eff7;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #778da3;
      }
      #boot .boot__brand {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #e9eff7;
      }
      #boot .boot__line {
        height: 2px;
        width: 100%;
        max-width: 220px;
        background: #16212d;
        overflow: hidden;
      }
      #boot .boot__line::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: #ffd23f;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      #boot .boot__status {
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      #boot .boot__about {
        max-width: 46ch;
        margin: 0;
        font-size: 12px;
        line-height: 1.7;
        color: #a9b8c9;
      }
      /* Shown only when the watchdog decides the bundle never executed. */
      #boot[data-stalled="true"] .boot__line {
        display: none;
      }
      #boot .boot__detail {
        display: none;
        max-width: 46ch;
        font-size: 12px;
        line-height: 1.7;
        color: #a9b8c9;
      }
      #boot[data-stalled="true"] .boot__detail {
        display: block;
      }
      #boot[data-stalled="true"] .boot__status {
        color: #ffd23f;
        font-weight: 600;
      }
      #boot button {
        display: none;
        align-self: flex-start;
        margin-top: 4px;
        padding: 10px 16px;
        font: inherit;
        font-size: 13px;
        color: #e9eff7;
        background: #16212d;
        border: 1px solid #2a3644;
        border-radius: 6px;
      }
      #boot[data-stalled="true"] button {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="boot__brand">YureWatch</div>
      <div class="boot__line" aria-hidden="true"></div>
      <div class="boot__status" data-boot-status>読み込み中…</div>
      <p class="boot__about">
        日本国内の地震情報・緊急地震速報（EEW）・津波情報を地図で確認できる情報閲覧アプリです。気象庁の発表を表示するもので、地震の予測や独自検出は行いません。
      </p>
      <p class="boot__detail" data-boot-detail>
        画面の読み込みに失敗した可能性があります。ビルド済みの単一ファイル版（dist/yurewatch.html）を開くか、アプリを再起動してください。
      </p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        YureWatch は、日本国内の地震情報・緊急地震速報（EEW）・津波情報を地図で確認できる情報閲覧アプリです。利用には JavaScript が必要です。ブラウザの設定で有効にしてください。地震の予測や独自検出を行うものではありません。最新の地震情報は気象庁の発表を確認してください。
      </p>
    </noscript>
    <!-- Loaded at the end of <body>: the single-file Android build inlines this
         as a classic script, so it must run after the document exists. -->
    <script type="module" src="/src/main.ts"></script>
    <script>
      /*
       * Boot watchdog.
       *
       * The splash used to sit there forever if the module bundle never ran —
       * which is exactly what happens when this file is opened on its own (no
       * bundler, no dev server, `file://`, or a sandboxed preview iframe).
       * Rather than show a logo for eternity, say what happened and offer a
       * reload. `main.ts` removes #boot as soon as it mounts the app.
       */
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        setTimeout(function () {
          if (!document.getElementById('boot')) return; // app mounted
          var status = boot.querySelector('[data-boot-status]');
          if (status) status.textContent = '起動に時間がかかっています';
          boot.setAttribute('data-stalled', 'true');
        }, 6000);
      })();
    </script>
  </body>
</html>
